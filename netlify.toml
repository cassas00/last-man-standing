[build]
  command = "pnpm run build"
  publish = "dist"

[dev]
  command = "pnpm run dev"
  targetPort = 4324
  port = 8888

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
